name: daily-monitor

# Every US trading day after the close: download pool prices, run the B1+MA60+day-3 checklist,
# commit the report and push it to WeChat / iPhone / email / Telegram via tools/notify.py (secrets).
on:
  # GitHub drops scheduled runs now and then (2026-11-02 never fired), so there are two;
  # the second one skips when the first already wrote that day's report.
  # Off the hour on purpose: top-of-hour schedules are the ones most often delayed or dropped.
  schedule:
    - cron: "37 21 * * 1-5"   # 21:37 UTC = 16:37 New York (EST) / 17:37 (EDT); ~05:37/04:37 Beijing
    - cron: "7 23 * * 1-5"    # backup: 23:07 UTC; ~07:07/06:07 Beijing
  workflow_dispatch:
    inputs:
      asof:
        description: "Data date YYYY-MM-DD (blank = today in New York)"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Monitor tests
        run: cd strategies/quant && python -m unittest tests.test_daily_monitor
      - name: Trading date
        id: day
        run: |
          d="${{ inputs.asof }}"
          echo "date=${d:-$(TZ=America/New_York date +%F)}" >> "$GITHUB_OUTPUT"
      - name: Skip if today's report already exists
        id: done
        run: |
          out="strategies/quant/monitor/reports/${{ steps.day.outputs.date }}.md"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "$out" ]; then
            echo "report for ${{ steps.day.outputs.date }} already exists (earlier schedule ran)"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download prices until today's bar is there
        id: data
        if: steps.done.outputs.skip != 'true'
        run: |
          cp strategies/friestrader/pool.txt /tmp/pool.txt
          tail -n +2 strategies/quant/monitor/positions.csv | cut -d, -f1 >> /tmp/pool.txt
          for attempt in 1 2 3 4; do
            python tools/fetch_yahoo.py --pool /tmp/pool.txt --start 2025-01-01 > /tmp/fetch.log 2>&1 || true
            tail -3 /tmp/fetch.log
            # Yahoo's daily endpoint can lag for hours; fill only the missing day from backup sources.
            python tools/fill_latest_bar.py --date "${{ steps.day.outputs.date }}" --pool /tmp/pool.txt > /tmp/fill.log 2>&1 || true
            grep -E "error|fallback for" /tmp/fill.log | tail -15 || true
            set +e
            python strategies/quant/monitor/daily_monitor.py --require-date "${{ steps.day.outputs.date }}" --check-only
            code=$?
            set -e
            if [ $code -eq 0 ]; then echo "state=ready" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ $code -eq 3 ]; then echo "state=holiday" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ $attempt -lt 4 ]; then echo "data not updated yet even with backups (attempt $attempt), waiting 10 min"; sleep 600; fi
          done
          echo "state=stale" >> "$GITHUB_OUTPUT"
      - name: Build report
        id: report
        if: steps.data.outputs.state == 'ready'
        run: |
          out="strategies/quant/monitor/reports/${{ steps.day.outputs.date }}.md"
          python strategies/quant/monitor/daily_monitor.py --asof "${{ steps.day.outputs.date }}" \
            --out "$out" --summary-out /tmp/summary.txt
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Warn that data is not updated
        # Only the backup schedule or a manual run warns; the first schedule leaves it to the backup.
        if: steps.data.outputs.state == 'stale' && (github.event_name != 'schedule' || github.event.schedule == '7 23 * * 1-5')
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          d="${{ steps.day.outputs.date }}"
          echo "盯盘 $d：Yahoo 行情还没更新到 $d，今天没有生成报告，请不要按旧报告操作" > /tmp/summary.txt
          { echo "# 盯盘 $d：行情未更新"; echo; echo "Yahoo 和备用源（Yahoo 分时、Nasdaq）重试 4 次（约 40 分钟）后，股票池里仍有超过 10% 的股票没有 $d 的日线，所以没有生成报告。"; echo;
            echo "可以稍后在 Actions 里手动运行 daily-monitor（asof 填 $d）。"; } > /tmp/stale.md
          python tools/notify.py /tmp/stale.md /tmp/summary.txt "https://github.com/${{ github.repository }}/actions/workflows/daily-monitor.yml"
          exit 1
      - name: Commit report
        if: steps.report.outputs.out != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategies/quant/monitor/reports/
          git commit -m "Daily monitor ${{ steps.day.outputs.date }} [skip ci]" || echo "nothing to commit"
          git push
      - name: Notify (WeChat / Bark / Telegram / email)
        if: steps.report.outputs.out != ''
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python tools/notify.py "${{ steps.report.outputs.out }}" /tmp/summary.txt \
            "https://github.com/${{ github.repository }}/blob/main/${{ steps.report.outputs.out }}"
